<section class="auth-page">
  <div class="auth-panel">
    <div class="eyebrow">Staff portal</div>
    <h1>Welcome back.</h1>
    <p class="subtle">Sign in to approve requests and track orders.</p>
    <form (ngSubmit)="submit()">
      <label>Username<input [(ngModel)]="username" name="username" required autocomplete="username"></label>
      <label>Password<input [(ngModel)]="password" name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary" type="submit" [disabled]="busy()">{{ busy() ? 'Signing in...' : 'Sign in' }}</button>
      <p class="error" *ngIf="error()">{{ error() }}</p>
    </form>
  </div>
</section>
