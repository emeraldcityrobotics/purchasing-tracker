<section class="auth-page">
  <div class="auth-panel">
    <div class="eyebrow">Staff portal</div>
    <h1>Welcome back.</h1>
    <p class="subtle">Sign in with your organization account to approve requests and track orders.</p>
    <p class="error" *ngIf="error()">{{ error() }}</p>
    <button class="btn btn-primary" type="button" (click)="signIn()">Sign in with SSO</button>
  </div>
</section>
