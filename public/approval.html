<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve Requests - Purchasing Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <h1>🛒 Purchasing Tracker</h1>
            <div id="loginError" class="alert alert-error hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="hidden">
        <!-- Header -->
        <div class="header">
            <h1>🛒 Purchasing Tracker</h1>
            <div class="header-nav">
                <a href="/" class="header-nav-link">New Request</a>
                <a href="/approval" class="header-nav-link active">Approvals</a>
                <a href="/tracking" class="header-nav-link">Track Orders</a>
                <a href="/admin" class="header-nav-link" id="adminLink" style="display: none;">Admin</a>
            </div>
            <div class="user-info">
                <span class="user-name" id="userName"></span>
                <span class="user-role" id="userRole"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Access Denied Message -->
            <div id="accessDenied" class="alert alert-error hidden">
                Access denied. You need admin or approver role to access this page.
            </div>
            <!-- Purchase Requests List -->
            <div id="requestsCard" class="card hidden">
                <h2>Purchase Requests Awaiting Approval</h2>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Order Name</th>
                                <th>Date</th>
                                <th>Requester</th>
                                <th>Vendor</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody">
                            <!-- Requests will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2>Purchase Request Details</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <div id="modalContent">
                <!-- Request details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentUser = null;
        let requests = [];
        let currentRequest = null;

        // Check authentication on page load
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (data.authenticated) {
                    currentUser = data;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('userName').textContent = data.fullName;
                    document.getElementById('userRole').textContent = data.role;
                    
                    // Show admin link for admin users
                    if (data.role === 'admin') {
                        document.getElementById('adminLink').style.display = 'inline-block';
                    }
                    
                    // Check if user has access
                    if (data.role === 'admin' || data.role === 'approver') {
                        document.getElementById('requestsCard').classList.remove('hidden');
                        await loadRequests();
                    } else {
                        document.getElementById('accessDenied').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('loginScreen').classList.remove('hidden');
                    document.getElementById('mainApp').classList.add('hidden');
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const loginError = document.getElementById('loginError');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    await checkAuth();
                } else {
                    loginError.textContent = data.error || 'Login failed';
                    loginError.classList.remove('hidden');
                }
            } catch (error) {
                loginError.textContent = 'Connection error';
                loginError.classList.remove('hidden');
            }
        });

        // Logout
        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.reload();
        }

        // Load requests
        async function loadRequests() {
            try {
                const response = await fetch('/api/purchase-requests');
                requests = await response.json();
                renderRequests();
                
                // Check if there's an ID in the URL to open directly
                const urlParams = new URLSearchParams(window.location.search);
                const requestId = urlParams.get('id');
                if (requestId) {
                    viewRequest(parseInt(requestId));
                }
            } catch (error) {
                console.error('Failed to load requests:', error);
                showError('Failed to load purchase requests');
            }
        }

        // Render requests table
        function renderRequests() {
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';
            
            // Filter for pending and approved requests only (exclude ordered and rejected)
            const displayRequests = requests.filter(r => 
                ['pending', 'approved'].includes(r.status)
            );
            
            if (displayRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 30px; color: #999;">No requests to display</td></tr>';
                return;
            }
            
            displayRequests.forEach(request => {
                const row = document.createElement('tr');
                const date = new Date(request.created_at).toLocaleDateString();
                const orderName = request.order_name || '<em style="color: #999;">No name</em>';
                
                row.innerHTML = `
                    <td>#${request.id}</td>
                    <td>${orderName}</td>
                    <td>${date}</td>
                    <td>${request.requester_name}</td>
                    <td>${request.vendor_name}</td>
                    <td>$${request.total.toFixed(2)}</td>
                    <td><span class="status-badge status-${request.status}">${request.status.replace('_', ' ')}</span></td>
                    <td>
                        <button class="btn btn-primary btn-small" onclick="viewRequest(${request.id})">View</button>
                        ${request.status === 'pending' ? `
                            <button class="btn btn-success btn-small" onclick="approveRequest(${request.id})">Approve</button>
                            <button class="btn btn-danger btn-small" onclick="rejectRequest(${request.id})">Reject</button>
                        ` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // View request details
        async function viewRequest(id) {
            try {
                const response = await fetch(`/api/purchase-requests/${id}`);
                currentRequest = await response.json();
                renderRequestDetails();
                document.getElementById('detailsModal').classList.add('show');
            } catch (error) {
                console.error('Failed to load request:', error);
                showError('Failed to load request details');
            }
        }

        // Render request details in modal
        function renderRequestDetails() {
            // Update modal header with ID and name
            const modalHeader = document.querySelector('#detailsModal .modal-header h2');
            const orderNameText = currentRequest.order_name ? `: ${currentRequest.order_name}` : '';
            modalHeader.textContent = `Purchase Request #${currentRequest.id}${orderNameText}`;
            
            const content = document.getElementById('modalContent');
            const date = new Date(currentRequest.created_at).toLocaleDateString();
            const approvedDate = currentRequest.approved_at ? new Date(currentRequest.approved_at).toLocaleDateString() : 'N/A';
            
            let itemsHtml = '<table style="margin-top: 20px;"><thead><tr><th>Product</th><th>Description</th><th>Purchase Link</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead><tbody>';
            
            currentRequest.items.forEach(item => {
                const linkHtml = item.purchase_link 
                    ? `<a href="${item.purchase_link}" target="_blank" style="color: #667eea; text-decoration: none;">🔗 Link</a>`
                    : '-';
                itemsHtml += `
                    <tr>
                        <td>${item.product_name}</td>
                        <td>${item.description || '-'}</td>
                        <td>${linkHtml}</td>
                        <td>${item.quantity}</td>
                        <td>$${item.unit_price.toFixed(2)}</td>
                        <td>$${item.line_total.toFixed(2)}</td>
                    </tr>
                `;
            });
            
            itemsHtml += '</tbody></table>';
            
            content.innerHTML = `
                <div class="request-details">
                    <div class="detail-item">
                        <div class="detail-label">Request ID</div>
                        <div class="detail-value">#${currentRequest.id}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Date Submitted</div>
                        <div class="detail-value">${date}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Requester</div>
                        <div class="detail-value">${currentRequest.requester_name}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Vendor</div>
                        <div class="detail-value">${currentRequest.vendor_name}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">
                            <span class="status-badge status-${currentRequest.status}">${currentRequest.status.replace('_', ' ')}</span>
                        </div>
                    </div>
                    ${currentRequest.requires_multi_approval ? `
                        <div class="detail-item" style="background: #fff3cd;">
                            <div class="detail-label">Approval Progress</div>
                            <div class="detail-value">${currentRequest.approval_count || 0} / 5 approvals</div>
                        </div>
                    ` : ''}
                </div>

                ${currentRequest.notes ? `
                    <div class="callout callout-warning">
                        <strong>Notes:</strong>
                        ${currentRequest.notes}
                    </div>
                ` : ''}

                ${currentRequest.requested_arrival_date ? `
                    <div class="callout callout-info">
                        <strong>📅 Requested Arrival Date</strong>
                        <span class="callout-date">${formatDate(currentRequest.requested_arrival_date)}</span>
                    </div>
                ` : ''}

                <h3>Items</h3>
                ${itemsHtml}

                <div class="summary-section">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span>$${currentRequest.subtotal.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax:</span>
                        <span>$${currentRequest.tax_amount.toFixed(2)}</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span>$${currentRequest.total.toFixed(2)}</span>
                    </div>
                </div>

                ${currentRequest.approved_by ? `
                    <div style="margin-top: 20px; padding: 15px; background: #d4edda; border-radius: 5px;">
                        <strong>Approval Information:</strong><br>
                        Approved by: ${currentRequest.approver_name}<br>
                        Date: ${approvedDate}
                    </div>
                ` : ''}

                ${currentRequest.status === 'pending' ? `
                    <div style="margin-top: 30px; display: flex; gap: 10px;">
                        <button class="btn btn-success" onclick="approveRequest(${currentRequest.id}); closeModal();">Approve Request</button>
                        <button class="btn btn-danger" onclick="rejectRequest(${currentRequest.id}); closeModal();">Reject Request</button>
                        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                    </div>
                ` : `
                    <div style="margin-top: 30px;">
                        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                    </div>
                `}
            `;
        }

        // Close modal
        function closeModal() {
            document.getElementById('detailsModal').classList.remove('show');
        }

        // Approve request
        async function approveRequest(id) {
            try {
                const response = await fetch(`/api/purchase-requests/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'approved' })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.approved === false && data.approvalCount) {
                        showSuccess(`Approval recorded (${data.approvalCount}/${data.required} approvals needed)`);
                    } else {
                        showSuccess(data.message || 'Purchase request approved successfully!');
                    }
                    await loadRequests();
                } else {
                    showError(data.error || 'Failed to approve request');
                }
            } catch (error) {
                showError('Connection error');
            }
        }

        // Reject request
        async function rejectRequest(id) {
            try {
                const response = await fetch(`/api/purchase-requests/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'rejected' })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Purchase request rejected');
                    await loadRequests();
                } else {
                    showError(data.error || 'Failed to reject request');
                }
            } catch (error) {
                showError('Connection error');
            }
        }

        // Toast notification system
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        function showSuccess(message) {
            showToast(message, 'success');
        }

        function showError(message) {
            showToast(message, 'error');
        }

        function formatDate(dateString) {
            if (!dateString) return 'Not specified';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
