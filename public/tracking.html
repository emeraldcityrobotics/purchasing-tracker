<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Orders - Purchasing Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <h1>🛒 Purchasing Tracker</h1>
            <div id="loginError" class="alert alert-error hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="hidden">
        <!-- Header -->
        <div class="header">
            <h1>🛒 Purchasing Tracker</h1>
            <div class="header-nav">
                <a href="/" class="header-nav-link">New Request</a>
                <a href="/approval" class="header-nav-link">Approvals</a>
                <a href="/tracking" class="header-nav-link active">Track Orders</a>
                <a href="/admin" class="header-nav-link" id="adminLink" style="display: none;">Admin</a>
            </div>
            <div class="user-info">
                <span class="user-name" id="userName"></span>
                <span class="user-role" id="userRole"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Filter Options -->
            <div class="card">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="margin: 0;">Filter by Status:</label>
                    <select id="statusFilter" onchange="filterRequests()" style="width: 200px;">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="ordered">Ordered</option>
                        <option value="partially_received">Partially Received</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <!-- Purchase Requests List -->
            <div class="card">
                <h2>Purchase Orders Tracking</h2>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Date</th>
                                <th>Vendor</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Progress</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody">
                            <!-- Requests will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content" style="max-width: 1000px;">
            <div class="modal-header">
                <h2>Purchase Order Tracking</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <div id="modalContent">
                <!-- Request details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentUser = null;
        let allRequests = [];
        let filteredRequests = [];
        let currentRequest = null;

        // Check authentication on page load
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (data.authenticated) {
                    currentUser = data;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('userName').textContent = data.fullName;
                    document.getElementById('userRole').textContent = data.role;
                    
                    // Show admin link for admin users
                    if (data.role === 'admin') {
                        document.getElementById('adminLink').style.display = 'inline-block';
                    }
                    
                    await loadRequests();
                } else {
                    document.getElementById('loginScreen').classList.remove('hidden');
                    document.getElementById('mainApp').classList.add('hidden');
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const loginError = document.getElementById('loginError');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    await checkAuth();
                } else {
                    loginError.textContent = data.error || 'Login failed';
                    loginError.classList.remove('hidden');
                }
            } catch (error) {
                loginError.textContent = 'Connection error';
                loginError.classList.remove('hidden');
            }
        });

        // Logout
        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.reload();
        }

        // Load requests
        async function loadRequests() {
            try {
                const response = await fetch('/api/purchase-requests');
                allRequests = await response.json();
                filterRequests();
            } catch (error) {
                console.error('Failed to load requests:', error);
                showError('Failed to load purchase requests');
            }
        }

        // Filter requests
        function filterRequests() {
            const statusFilter = document.getElementById('statusFilter').value;
            
            if (statusFilter === 'all') {
                filteredRequests = allRequests;
            } else {
                filteredRequests = allRequests.filter(r => r.status === statusFilter);
            }
            
            renderRequests();
        }

        // Calculate progress percentage
        function calculateProgress(request) {
            // For requests without items loaded, estimate based on status
            if (request.status === 'pending' || request.status === 'rejected') return 0;
            if (request.status === 'approved') return 25;
            if (request.status === 'ordered') return 50;
            if (request.status === 'completed') return 100;
            return 75; // partially_received
        }

        // Render requests table
        function renderRequests() {
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';
            
            if (filteredRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; color: #999;">No requests to display</td></tr>';
                return;
            }
            
            filteredRequests.forEach(request => {
                const row = document.createElement('tr');
                const date = new Date(request.created_at).toLocaleDateString();
                const progress = calculateProgress(request);
                
                row.innerHTML = `
                    <td>#${request.id}</td>
                    <td>${date}</td>
                    <td>${request.vendor_name}</td>
                    <td>$${request.total.toFixed(2)}</td>
                    <td><span class="status-badge status-${request.status}">${request.status.replace('_', ' ')}</span></td>
                    <td>
                        <div style="width: 100px; background: #e9ecef; border-radius: 10px; height: 20px; overflow: hidden;">
                            <div style="width: ${progress}%; background: #667eea; height: 100%; transition: width 0.3s;"></div>
                        </div>
                        <small style="color: #666;">${progress}%</small>
                    </td>
                    <td>
                        <button class="btn btn-primary btn-small" onclick="viewRequest(${request.id})">
                            ${request.status === 'approved' || request.status === 'ordered' || request.status === 'partially_received' ? 'Track & Receive' : 'View Details'}
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // View request details
        async function viewRequest(id) {
            try {
                const response = await fetch(`/api/purchase-requests/${id}`);
                currentRequest = await response.json();
                renderRequestDetails();
                document.getElementById('detailsModal').classList.add('show');
            } catch (error) {
                console.error('Failed to load request:', error);
                showError('Failed to load request details');
            }
        }

        // Render request details in modal
        function renderRequestDetails() {
            const content = document.getElementById('modalContent');
            const date = new Date(currentRequest.created_at).toLocaleDateString();
            const canReceive = (currentUser.role === 'admin' || currentUser.role === 'purchaser') && 
                              ['approved', 'ordered', 'partially_received'].includes(currentRequest.status);
            
            // Calculate overall progress
            let totalQuantity = 0;
            let totalReceived = 0;
            currentRequest.items.forEach(item => {
                totalQuantity += item.quantity;
                totalReceived += item.quantity_received;
            });
            const overallProgress = totalQuantity > 0 ? Math.round((totalReceived / totalQuantity) * 100) : 0;
            
            let itemsHtml = '<div style="margin-top: 20px;"><h3>Items</h3><table><thead><tr><th>Product</th><th>Description</th><th>Purchase Link</th><th>Ordered</th><th>Received</th><th>Unit Price</th><th>Total</th>';
            
            if (canReceive) {
                itemsHtml += '<th>Receive Items</th>';
            }
            
            itemsHtml += '</tr></thead><tbody>';
            
            currentRequest.items.forEach(item => {
                const remaining = item.quantity - item.quantity_received;
                const isFullyReceived = item.quantity_received >= item.quantity;
                const linkHtml = item.purchase_link 
                    ? `<a href="${item.purchase_link}" target="_blank" style="color: #667eea; text-decoration: none;">🔗 Link</a>`
                    : '-';
                
                itemsHtml += `
                    <tr style="${isFullyReceived ? 'background: #d4edda;' : ''}">
                        <td>${item.product_name}</td>
                        <td>${item.description || '-'}</td>
                        <td>${linkHtml}</td>
                        <td>${item.quantity}</td>
                        <td>${item.quantity_received} ${isFullyReceived ? '✓' : ''}</td>
                        <td>$${item.unit_price.toFixed(2)}</td>
                        <td>$${item.line_total.toFixed(2)}</td>
                `;
                
                if (canReceive && !isFullyReceived) {
                    itemsHtml += `
                        <td>
                            <div class="receive-input">
                                <input type="number" id="receive-${item.id}" min="1" max="${remaining}" value="${remaining}" style="width: 60px;">
                                <button class="btn btn-success btn-small" onclick="receiveItems(${currentRequest.id}, ${item.id})">Receive</button>
                            </div>
                        </td>
                    `;
                } else if (canReceive && isFullyReceived) {
                    itemsHtml += '<td style="color: #28a745; font-weight: 600;">Complete</td>';
                } else {
                    itemsHtml += '<td>-</td>';
                }
                
                itemsHtml += '</tr>';
            });
            
            itemsHtml += '</tbody></table></div>';
            
            content.innerHTML = `
                ${canReceive && currentRequest.status === 'approved' ? `
                    <div style="margin-bottom: 20px; padding: 15px; background: #d1ecf1; border-radius: 5px; border-left: 4px solid #17a2b8;">
                        <p style="margin: 0 0 10px 0;"><strong>🚀 Ready to Order?</strong></p>
                        <button class="btn btn-success" onclick="markAsOrdered(${currentRequest.id})">Mark as Ordered</button>
                        <p style="margin: 10px 0 0 0; font-size: 12px; color: #666;">
                            Click this button once you've placed the order with the vendor
                        </p>
                    </div>
                ` : ''}

                <div class="request-details">
                    <div class="detail-item">
                        <div class="detail-label">Order ID</div>
                        <div class="detail-value">#${currentRequest.id}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Date</div>
                        <div class="detail-value">${date}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Requester</div>
                        <div class="detail-value">${currentRequest.requester_name}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Vendor</div>
                        <div class="detail-value">${currentRequest.vendor_name}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">
                            <span class="status-badge status-${currentRequest.status}">${currentRequest.status.replace('_', ' ')}</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Overall Progress</div>
                        <div class="detail-value">
                            <div style="width: 100%; background: #e9ecef; border-radius: 10px; height: 24px; overflow: hidden; margin-bottom: 8px;">
                                <div style="width: ${overallProgress}%; background: linear-gradient(90deg, #667eea, #764ba2); height: 100%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 12px;">
                                    ${overallProgress}%
                                </div>
                            </div>
                            <div style="font-size: 13px; color: #666; font-weight: normal;">
                                <strong style="color: #333;">${totalReceived}</strong> of <strong style="color: #333;">${totalQuantity}</strong> items received
                            </div>
                        </div>
                    </div>
                </div>

                ${currentRequest.notes ? `
                    <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 5px;">
                        <strong>Notes:</strong><br>${currentRequest.notes}
                    </div>
                ` : ''}

                ${itemsHtml}

                <div class="summary-section">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span>$${currentRequest.subtotal.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax:</span>
                        <span>$${currentRequest.tax_amount.toFixed(2)}</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span>$${currentRequest.total.toFixed(2)}</span>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                </div>
            `;
        }

        // Mark as ordered
        async function markAsOrdered(id) {
            if (!confirm('Confirm that you have placed this order with the vendor?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/purchase-requests/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'ordered' })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Order status updated to "Ordered"');
                    closeModal();
                    await loadRequests();
                } else {
                    showError(data.error || 'Failed to update status');
                }
            } catch (error) {
                showError('Connection error');
            }
        }

        // Receive items
        async function receiveItems(requestId, itemId) {
            const input = document.getElementById(`receive-${itemId}`);
            const quantity = parseInt(input.value);
            
            if (!quantity || quantity <= 0) {
                showError('Please enter a valid quantity');
                return;
            }
            
            if (!confirm(`Confirm receiving ${quantity} unit(s) of this item?`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/purchase-requests/${requestId}/items/${itemId}/receive`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity_received: quantity })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(`Successfully received ${quantity} item(s)!`);
                    
                    // Reload the request details
                    const detailResponse = await fetch(`/api/purchase-requests/${requestId}`);
                    currentRequest = await detailResponse.json();
                    renderRequestDetails();
                    
                    // Reload the list
                    await loadRequests();
                } else {
                    showError(data.error || 'Failed to receive items');
                }
            } catch (error) {
                showError('Connection error');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('detailsModal').classList.remove('show');
        }

        // Toast notification system
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        function showSuccess(message) {
            showToast(message, 'success');
        }

        function showError(message) {
            showToast(message, 'error');
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
