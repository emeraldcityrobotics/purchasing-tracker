<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Orders - Purchasing Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <h1>🛒 Purchasing Tracker</h1>
            <div id="loginError" class="alert alert-error hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="hidden">
        <!-- Header -->
        <div class="header">
            <h1>🛒 Purchasing Tracker</h1>
            <div class="header-nav">
                <a href="/" class="header-nav-link">New Request</a>
                <a href="/approval" class="header-nav-link">Approvals</a>
                <a href="/tracking" class="header-nav-link active">Track Orders</a>
                <a href="/admin" class="header-nav-link" id="adminLink" style="display: none;">Admin</a>
            </div>
            <div class="user-info">
                <span class="user-name" id="userName"></span>
                <span class="user-role" id="userRole"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Filter Options -->
            <div class="card">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="margin: 0;">Filter by Status:</label>
                    <select id="statusFilter" onchange="filterRequests()" style="width: 200px;">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="ordered">Ordered</option>
                        <option value="partially_received">Partially Received</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <!-- Purchase Requests List -->
            <div class="card">
                <h2>Purchase Orders Tracking</h2>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Order Name</th>
                                <th>Date</th>
                                <th>Vendor</th>
                                <th>Estimated</th>
                                <th>Actual Spent</th>
                                <th>Funding</th>
                                <th>Status</th>
                                <th>Tracking</th>
                                <th>Est. Delivery</th>
                                <th>Progress</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody">
                            <!-- Requests will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content" style="max-width: 1000px;">
            <div class="modal-header">
                <h2>Purchase Order Tracking</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <div id="modalContent">
                <!-- Request details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentUser = null;
        let allRequests = [];
        let filteredRequests = [];
        let currentRequest = null;

        // Check authentication on page load
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (data.authenticated) {
                    currentUser = data;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('userName').textContent = data.fullName;
                    document.getElementById('userRole').textContent = data.role;
                    
                    // Show admin link for admin users
                    if (data.role === 'admin') {
                        document.getElementById('adminLink').style.display = 'inline-block';
                    }
                    
                    await loadRequests();
                } else {
                    document.getElementById('loginScreen').classList.remove('hidden');
                    document.getElementById('mainApp').classList.add('hidden');
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const loginError = document.getElementById('loginError');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    await checkAuth();
                } else {
                    loginError.textContent = data.error || 'Login failed';
                    loginError.classList.remove('hidden');
                }
            } catch (error) {
                loginError.textContent = 'Connection error';
                loginError.classList.remove('hidden');
            }
        });

        // Logout
        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.reload();
        }

        // Load requests
        async function loadRequests() {
            try {
                const response = await fetch('/api/purchase-requests');
                allRequests = await response.json();
                filterRequests();
                
                // Check if there's an ID in the URL to open directly
                const urlParams = new URLSearchParams(window.location.search);
                const requestId = urlParams.get('id');
                if (requestId) {
                    viewRequest(parseInt(requestId));
                }
            } catch (error) {
                console.error('Failed to load requests:', error);
                showError('Failed to load purchase requests');
            }
        }

        // Filter requests
        function filterRequests() {
            const statusFilter = document.getElementById('statusFilter').value;
            
            if (statusFilter === 'all') {
                filteredRequests = allRequests;
            } else {
                filteredRequests = allRequests.filter(r => r.status === statusFilter);
            }
            
            renderRequests();
        }

        // Calculate progress percentage
        function calculateProgress(request) {
            // For requests without items loaded, estimate based on status
            if (request.status === 'pending' || request.status === 'rejected') return 0;
            if (request.status === 'approved') return 25;
            if (request.status === 'ordered') return 50;
            if (request.status === 'completed') return 100;
            return 75; // partially_received
        }

        // Render requests table
        function renderRequests() {
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';
            
            if (filteredRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" style="text-align: center; padding: 30px; color: #999;">No requests to display</td></tr>';
                return;
            }
            
            filteredRequests.forEach(request => {
                const row = document.createElement('tr');
                const date = new Date(request.created_at).toLocaleDateString();
                const progress = calculateProgress(request);
                const orderName = request.order_name || '<em style="color: #999;">No name</em>';
                
                // Calculate if there's a cost variance
                const hasActualAmount = request.actual_amount_spent !== null && request.actual_amount_spent !== undefined;
                const costVariance = hasActualAmount ? (request.actual_amount_spent - request.total) : 0;
                const varianceClass = costVariance > 0.01 ? 'cost-over' : costVariance < -0.01 ? 'cost-under' : '';
                
                row.innerHTML = `
                    <td>#${request.id}</td>
                    <td>${orderName}</td>
                    <td>${date}</td>
                    <td>${request.vendor_name}</td>
                    <td>$${request.total.toFixed(2)}</td>
                    <td class="${varianceClass}">
                        ${hasActualAmount ? 
                            `$${request.actual_amount_spent.toFixed(2)}${Math.abs(costVariance) > 0.01 ? 
                                `<br><small style="color: ${costVariance > 0 ? '#dc3545' : '#28a745'};">(${costVariance > 0 ? '+' : ''}$${costVariance.toFixed(2)})</small>` : 
                                ''
                            }` : 
                            '<span style="color: #999;">-</span>'
                        }
                    </td>
                    <td>${request.funding_source_name ? `<span style="color: #007bff; font-weight: 500;">${request.funding_source_name}</span>` : '<span style="color: #999;">-</span>'}</td>
                    <td><span class="status-badge status-${request.status}">${request.status.replace('_', ' ')}</span></td>
                    <td>${request.tracking_number ? `<span style="color: #28a745; font-weight: 500;">${request.tracking_number}</span>` : '<span style="color: #999;">-</span>'}</td>
                    <td>${request.estimated_delivery_date ? `<span style="color: #007bff;">${formatDate(request.estimated_delivery_date)}</span>` : '<span style="color: #999;">-</span>'}</td>
                    <td>
                        <div style="width: 100px; background: #e9ecef; border-radius: 10px; height: 20px; overflow: hidden;">
                            <div style="width: ${progress}%; background: #667eea; height: 100%; transition: width 0.3s;"></div>
                        </div>
                        <small style="color: #666;">${progress}%</small>
                    </td>
                    <td>
                        <button class="btn btn-primary btn-small" onclick="viewRequest(${request.id})">
                            ${request.status === 'approved' || request.status === 'ordered' || request.status === 'partially_received' ? 'Track & Receive' : 'View Details'}
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // View request details
        async function viewRequest(id) {
            try {
                const response = await fetch(`/api/purchase-requests/${id}`);
                currentRequest = await response.json();
                renderRequestDetails();
                document.getElementById('detailsModal').classList.add('show');
            } catch (error) {
                console.error('Failed to load request:', error);
                showError('Failed to load request details');
            }
        }

        // Render request details in modal
        function renderRequestDetails() {
            // Update modal header with ID and name
            const modalHeader = document.querySelector('#detailsModal .modal-header h2');
            const orderNameText = currentRequest.order_name ? `: ${currentRequest.order_name}` : '';
            modalHeader.textContent = `Purchase Request #${currentRequest.id}${orderNameText}`;
            
            const content = document.getElementById('modalContent');
            const date = new Date(currentRequest.created_at).toLocaleDateString();
            const canReceive = (currentUser.role === 'admin' || currentUser.role === 'purchaser') && 
                              ['approved', 'ordered', 'partially_received'].includes(currentRequest.status);
            
            // Calculate overall progress
            let totalQuantity = 0;
            let totalReceived = 0;
            currentRequest.items.forEach(item => {
                totalQuantity += item.quantity;
                totalReceived += item.quantity_received;
            });
            const overallProgress = totalQuantity > 0 ? Math.round((totalReceived / totalQuantity) * 100) : 0;
            
            let itemsHtml = '<div style="margin-top: 20px;"><h3>Items</h3><table><thead><tr><th>Product</th><th>Description</th><th>Purchase Link</th><th>Ordered</th><th>Received</th><th>Unit Price</th><th>Total</th>';
            
            if (canReceive) {
                itemsHtml += '<th>Receive Items</th>';
            }
            
            itemsHtml += '</tr></thead><tbody>';
            
            currentRequest.items.forEach(item => {
                const remaining = item.quantity - item.quantity_received;
                const isFullyReceived = item.quantity_received >= item.quantity;
                const linkHtml = item.purchase_link 
                    ? `<a href="${item.purchase_link}" target="_blank" style="color: #667eea; text-decoration: none;">🔗 Link</a>`
                    : '-';
                
                itemsHtml += `
                    <tr style="${isFullyReceived ? 'background: #d4edda;' : ''}">
                        <td>${item.product_name}</td>
                        <td>${item.description || '-'}</td>
                        <td>${linkHtml}</td>
                        <td>${item.quantity}</td>
                        <td>${item.quantity_received} ${isFullyReceived ? '✓' : ''}</td>
                        <td>$${item.unit_price.toFixed(2)}</td>
                        <td>$${item.line_total.toFixed(2)}</td>
                `;
                
                if (canReceive && !isFullyReceived) {
                    itemsHtml += `
                        <td>
                            <div class="receive-input">
                                <input type="number" id="receive-${item.id}" min="1" max="${remaining}" value="${remaining}" style="width: 60px;">
                                <button class="btn btn-success btn-small" onclick="receiveItems(${currentRequest.id}, ${item.id})">Receive</button>
                            </div>
                        </td>
                    `;
                } else if (canReceive && isFullyReceived) {
                    itemsHtml += '<td style="color: #28a745; font-weight: 600;">Complete</td>';
                } else {
                    itemsHtml += '<td>-</td>';
                }
                
                itemsHtml += '</tr>';
            });
            
            itemsHtml += '</tbody></table></div>';
            
            content.innerHTML = `
                ${canReceive && currentRequest.status === 'approved' ? `
                    <div style="margin-bottom: 20px; padding: 15px; background: #d1ecf1; border-radius: 5px; border-left: 4px solid #17a2b8;">
                        <p style="margin: 0 0 10px 0;"><strong>🚀 Ready to Order?</strong></p>
                        <button class="btn btn-success" onclick="markAsOrdered(${currentRequest.id})">Mark as Ordered</button>
                        <p style="margin: 10px 0 0 0; font-size: 12px; color: #666;">
                            Click this button once you've placed the order with the vendor
                        </p>
                    </div>
                ` : ''}

                <div class="request-details">
                    <div class="detail-item">
                        <div class="detail-label">Order ID</div>
                        <div class="detail-value">#${currentRequest.id}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Date</div>
                        <div class="detail-value">${date}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Requester</div>
                        <div class="detail-value">${currentRequest.requester_name}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Vendor</div>
                        <div class="detail-value">${currentRequest.vendor_name}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">
                            <span class="status-badge status-${currentRequest.status}">${currentRequest.status.replace('_', ' ')}</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Overall Progress</div>
                        <div class="detail-value">
                            <div style="width: 100%; background: #e9ecef; border-radius: 10px; height: 24px; overflow: hidden; margin-bottom: 8px;">
                                <div style="width: ${overallProgress}%; background: linear-gradient(90deg, #667eea, #764ba2); height: 100%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 12px;">
                                    ${overallProgress}%
                                </div>
                            </div>
                            <div style="font-size: 13px; color: #666; font-weight: normal;">
                                <strong style="color: #333;">${totalReceived}</strong> of <strong style="color: #333;">${totalQuantity}</strong> items received
                            </div>
                        </div>
                    </div>
                </div>

                ${currentRequest.notes ? `
                    <div class="callout callout-warning">
                        <strong>Notes:</strong>
                        ${currentRequest.notes}
                    </div>
                ` : ''}

                ${currentRequest.requested_arrival_date ? `
                    <div class="callout callout-info">
                        <strong>📅 Requested Arrival Date</strong>
                        <span class="callout-date">${formatDate(currentRequest.requested_arrival_date)}</span>
                    </div>
                ` : ''}

                ${currentRequest.tracking_number ? `
                    <div class="callout callout-success">
                        <strong>📦 Tracking Number</strong>
                        <span class="callout-text">${currentRequest.tracking_number}</span>
                    </div>
                ` : ''}

                ${currentRequest.estimated_delivery_date ? `
                    <div class="callout callout-info">
                        <strong>🚚 Estimated Delivery Date</strong>
                        <span class="callout-date">${formatDate(currentRequest.estimated_delivery_date)}</span>
                    </div>
                ` : ''}

                ${itemsHtml}

                <div class="summary-section">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span>$${currentRequest.subtotal.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax:</span>
                        <span>$${currentRequest.tax_amount.toFixed(2)}</span>
                    </div>
                    <div class="summary-row ${currentRequest.actual_amount_spent ? '' : 'total'}">
                        <span>Estimated Total:</span>
                        <span>$${currentRequest.total.toFixed(2)}</span>
                    </div>
                    ${currentRequest.actual_amount_spent ? `
                        <div class="summary-row total">
                            <span>Actual Amount Spent:</span>
                            <span>$${currentRequest.actual_amount_spent.toFixed(2)}</span>
                        </div>
                        ${Math.abs(currentRequest.actual_amount_spent - currentRequest.total) > 0.01 ? `
                            <div class="summary-row" style="color: ${currentRequest.actual_amount_spent > currentRequest.total ? '#dc3545' : '#28a745'};">
                                <span>Difference:</span>
                                <span>${currentRequest.actual_amount_spent > currentRequest.total ? '+' : ''}$${(currentRequest.actual_amount_spent - currentRequest.total).toFixed(2)}</span>
                            </div>
                        ` : ''}
                        ${currentRequest.funding_source_name ? `
                            <div class="summary-row">
                                <span>Funding Source:</span>
                                <span style="font-weight: 600; color: #007bff;">${currentRequest.funding_source_name}</span>
                            </div>
                        ` : ''}
                    ` : ''}
                </div>

                <div style="margin-top: 30px;">
                    ${canReceive && ['ordered', 'partially_received', 'completed'].includes(currentRequest.status) ? `
                        <button class="btn btn-primary" onclick="editTracking(${currentRequest.id})">Edit Tracking Info</button>
                        <button class="btn btn-success" onclick="exportToGoogleSheets(${currentRequest.id})" style="margin-left: 10px;">📊 Export to Sheets</button>
                    ` : ''}
                    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                </div>
            `;
        }

        // Mark as ordered
        function markAsOrdered(id) {
            showOrderForm(id);
        }

        // Show order form for tracking details
        function showOrderForm(id) {
            const modalContent = document.getElementById('modalContent');
            const estimatedTotal = currentRequest ? currentRequest.total : 0;
            
            modalContent.innerHTML = `
                <h3>Mark Order as Placed</h3>
                <p>Please provide the order details and tracking information:</p>
                
                <form id="orderForm" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="actualAmount">Actual Amount Spent ($) <span style="color: red;">*</span></label>
                        <input type="number" id="actualAmount" step="0.01" min="0" value="${estimatedTotal}" required>
                        <small style="color: #666;">
                            Enter the actual total amount paid to the vendor (estimated: $${estimatedTotal.toFixed(2)})
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label for="fundingSource">Funding Source <span style="color: red;">*</span></label>
                        <select id="fundingSource" required>
                            <option value="">Select funding source...</option>
                        </select>
                        <small style="color: #666;">Choose the budget/account this purchase should be charged to</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="trackingNumber">Tracking Number</label>
                        <input type="text" id="trackingNumber" placeholder="Enter tracking number (optional)">
                        <small style="color: #666;">If available from the vendor</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="estimatedDelivery">Estimated Delivery Date</label>
                        <input type="date" id="estimatedDelivery">
                        <small style="color: #666;">Expected delivery date from vendor</small>
                    </div>
                    
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd;">
                        <button type="submit" class="btn btn-success">Confirm Order Placed</button>
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    </div>
                </form>
            `;
            
            // Load funding sources for the dropdown
            loadFundingSources();
            
            // Handle form submission
            document.getElementById('orderForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const actualAmount = parseFloat(document.getElementById('actualAmount').value);
                const fundingSourceId = document.getElementById('fundingSource').value;
                const trackingNumber = document.getElementById('trackingNumber').value.trim();
                const estimatedDelivery = document.getElementById('estimatedDelivery').value;
                
                // Validate actual amount
                if (!actualAmount || actualAmount <= 0) {
                    showError('Please enter a valid actual amount spent');
                    return;
                }
                
                // Validate funding source
                if (!fundingSourceId) {
                    showError('Please select a funding source');
                    return;
                }
                
                try {
                    const response = await fetch(`/api/purchase-requests/${id}/status`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            status: 'ordered',
                            tracking_number: trackingNumber || null,
                            estimated_delivery_date: estimatedDelivery || null,
                            actual_amount_spent: actualAmount,
                            funding_source_id: parseInt(fundingSourceId)
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        showSuccess('Order status updated to "Ordered"');
                        closeModal();
                        await loadRequests();
                    } else {
                        showError(data.error || 'Failed to update status');
                    }
                } catch (error) {
                    showError('Connection error');
                }
            });
            
            // Show the modal with proper centering
            const modal = document.getElementById('detailsModal');
            modal.classList.add('show');
        }

        // Edit tracking information
        function editTracking(id) {
            const request = allRequests.find(r => r.id === id);
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <h3>Edit Tracking Information</h3>
                <p>Update the tracking details for Order #${id}:</p>
                
                <form id="trackingForm" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="editActualAmount">Actual Amount Spent ($)</label>
                        <input type="number" id="editActualAmount" step="0.01" min="0" value="${request.actual_amount_spent || request.total}" placeholder="0.00">
                        <small style="color: #666;">
                            Total amount actually paid to vendor (estimated: $${request.total.toFixed(2)})
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label for="editTrackingNumber">Tracking Number</label>
                        <input type="text" id="editTrackingNumber" value="${request.tracking_number || ''}" placeholder="Enter tracking number">
                        <small style="color: #666;">Package tracking number from the carrier</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="editEstimatedDelivery">Estimated Delivery Date</label>
                        <input type="date" id="editEstimatedDelivery" value="${request.estimated_delivery_date || ''}">
                        <small style="color: #666;">Expected delivery date</small>
                    </div>
                    
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd;">
                        <button type="submit" class="btn btn-primary">Update Tracking Info</button>
                        <button type="button" class="btn btn-secondary" onclick="viewRequest(${id})">Cancel</button>
                    </div>
                </form>
            `;
            
            // Handle form submission
            document.getElementById('trackingForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const actualAmount = parseFloat(document.getElementById('editActualAmount').value);
                const trackingNumber = document.getElementById('editTrackingNumber').value.trim();
                const estimatedDelivery = document.getElementById('editEstimatedDelivery').value;
                
                // Validate actual amount
                if (!actualAmount || actualAmount <= 0) {
                    showError('Please enter a valid actual amount spent');
                    return;
                }
                
                try {
                    const response = await fetch(`/api/purchase-requests/${id}/tracking`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            tracking_number: trackingNumber || null,
                            estimated_delivery_date: estimatedDelivery || null,
                            actual_amount_spent: actualAmount
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        showSuccess('Tracking information updated successfully');
                        await loadRequests();
                        viewRequest(id); // Refresh the view
                    } else {
                        showError(data.error || 'Failed to update tracking information');
                    }
                } catch (error) {
                    showError('Connection error');
                }
            });
        }

        // Receive items
        async function receiveItems(requestId, itemId) {
            const input = document.getElementById(`receive-${itemId}`);
            const quantity = parseInt(input.value);
            
            if (!quantity || quantity <= 0) {
                showError('Please enter a valid quantity');
                return;
            }
            
            if (!confirm(`Confirm receiving ${quantity} unit(s) of this item?`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/purchase-requests/${requestId}/items/${itemId}/receive`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity_received: quantity })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(`Successfully received ${quantity} item(s)!`);
                    
                    // Reload the request details
                    const detailResponse = await fetch(`/api/purchase-requests/${requestId}`);
                    currentRequest = await detailResponse.json();
                    renderRequestDetails();
                    
                    // Reload the list
                    await loadRequests();
                } else {
                    showError(data.error || 'Failed to receive items');
                }
            } catch (error) {
                showError('Connection error');
            }
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('detailsModal');
            modal.classList.remove('show');
            modal.style.display = 'none';
        }

        // Load funding sources for dropdown
        async function loadFundingSources() {
            try {
                const response = await fetch('/api/funding-sources');
                const data = await response.json();
                
                const select = document.getElementById('fundingSource');
                if (select) {
                    select.innerHTML = '<option value="">Select funding source...</option>';
                    
                    data.fundingSources.forEach(source => {
                        if (source.is_active) {
                            const option = document.createElement('option');
                            option.value = source.id;
                            option.textContent = source.name;
                            select.appendChild(option);
                        }
                    });
                }
            } catch (error) {
                console.error('Failed to load funding sources:', error);
                showError('Failed to load funding sources');
            }
        }

        // Toast notification system
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        function showSuccess(message) {
            showToast(message, 'success');
        }

        function showError(message) {
            showToast(message, 'error');
        }

        // Export to Google Sheets
        async function exportToGoogleSheets(id) {
            try {
                showSuccess('Exporting to Google Sheets...');
                
                const response = await fetch(`/api/google-sheets/export/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Order exported to Google Sheets successfully! 📊');
                } else {
                    showError(data.error || 'Failed to export to Google Sheets');
                }
            } catch (error) {
                console.error('Export error:', error);
                showError('Failed to export to Google Sheets');
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'Not specified';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
